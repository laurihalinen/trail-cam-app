# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: jamk1
# "app" enables Serverless Framework Dashboard features and sharing them with other Services.
app: trail-cam
# "service" is the name of this project. This will also be added to your AWS resource names.
service: trail-cam-app
useDotenv: true
provider:
  name: aws
  runtime: nodejs24.x
  region: us-east-1
  environment:
    USER_POOL_ID: { Ref: UserPool } # cogniton user pool
    USER_CLIENT_ID: { Ref: UserClient } # cogniton client id
    CAM_TABLE: ${self:service}-trailcamTable
    MAIN_TABLE: ${self:service}-mainTable
    CLIENT_ID: ${env:CLIENT_ID}
    CLIENT_SECRET: ${env:CLIENT_SECRET}
    REFRESH_TOKEN: ${env:REFRESH_TOKEN}
  iam:
    role:
      statements:
        - Effect: 'Allow'
          Action:
            - cognito-idp:AdminInitiateAuth
            - cognito-idp:AdminCreateUser
            - cognito-idp:AdminSetUserPassword
          Resource:
            - !Sub arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${UserPool}
        - Effect: Allow
          Action:
            - s3:ListBucket
          Resource:
            - arn:aws:s3:::trail-cam-app
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
          Resource:
            - arn:aws:s3:::trail-cam-app/*
        - Effect: Allow
          Action:
            - rekognition:DetectLabels
          Resource: '*'
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:GetItem
            - dynamodb:Scan
          Resource:
            - arn:aws:dynamodb:us-east-1:*:table/${self:service}-trailcamTable
            - arn:aws:dynamodb:us-east-1:*:table/${self:service}-mainTable
  httpApi:
    cors:
      allowedOrigins:
        - http://localhost:4200
      allowedHeaders:
        - Content-Type
        - Authorization
      allowedMethods:
        - GET
        - POST
        - OPTIONS
    authorizers:
      PrivateAuthorizer: # Cogniton authorizerin nimi
        type: jwt
        identitySource: $request.header.Authorization
        issuerUrl:
          Fn::Join:
            - ''
            - - 'https://cognito-idp.'
              - '${opt:region, self:provider.region}'
              - '.amazonaws.com/'
              - Ref: UserPool
        audience:
          - Ref: UserClient

functions:
  loginUser: # sisäänkirjautuminen
    handler: functions/user/login.handler
    events:
      - httpApi:
          path: /user/login
          method: post

  #signupUser: # rekisteröityminen
  #handler: functions/user/signup.handler
  #events:
  #- httpApi:
  # path: /user/signup
  # method: post
  uploadEmail:
    handler: functions/uploadEmail.handler
    events:
      - httpApi:
          path: /upload
          method: post
  getImages:
    handler: functions/getImages.handler
    events:
      - httpApi:
          path: /images
          method: get
          authorizer: PrivateAuthorizer # suojaus
  imageAnalyzer:
    handler: functions/imageRekognition.handler
    events:
      - s3:
          bucket: trail-cam-app
          event: s3:ObjectCreated:*
          existing: true
          rules:
            - prefix: trailcam/
  gmailFetcher:
    handler: functions/gmailFetcher.handler
    timeout: 60
    events:
      - schedule: rate(1 minute)
resources:
  Resources:
    UserPool: # cognito userpool
      Type: AWS::Cognito::UserPool
      Properties:
        UserPoolName: trailcam-auth-pool
        Schema: # käyttäjän tietojen skeema cognitossa. Tässä pelkkä sähköposti
          - Name: email
            Required: true
            Mutable: true
        Policies:
          PasswordPolicy: # salasanan ominaisuudet
            MinimumLength: 6
        AutoVerifiedAttributes: ['email'] # sähköposti validoidaan

    UserClient: # cognito userpoolin client
      Type: AWS::Cognito::UserPoolClient
      Properties:
        ClientName: trailcam-client
        GenerateSecret: false
        UserPoolId: { Ref: UserPool }
        AccessTokenValidity: 5 # token validi 5 tuntia
        IdTokenValidity: 5
        ExplicitAuthFlows:
          - 'ADMIN_NO_SRP_AUTH' # autorisaatio sähköpostilla ja salasanalla
    TrailCamTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-trailcamTable
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: key
            AttributeType: S
        KeySchema:
          - AttributeName: key
            KeyType: HASH
    MainTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-mainTable
        BillingMode: PAY_PER_REQUEST # Ei kapasiteetin hallintaa
        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S
          - AttributeName: SK
            AttributeType: S
        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE

plugins:
  - serverless-prune-plugin

custom:
  prune:
    automatic: true # cleans up automatically after deploy
    number: 3
